# UDrive Core Configuration
udrive:
  # External URL used to access UDrive (e.g. https://drive.company.com)
  url: "https://drive.unity-workspace.com"
  logLevel: info
  # Set to true only if using self-signed internal TLS certificates
  insecure: true

  # Administrator Credentials (managed via Vault when vault.enabled: true)
  admin:
    username: admin
    password: ""
    existingSecret: ""
    passwordKey: "admin-password"

  # Create demo users (einstein, marie, katherine) for testing
  demoUsers: false

  # Basic Auth support (useful for legacy WebDAV clients)
  enableBasicAuth: true

  # Asynchronous file uploads and postprocessing.
  # When false (recommended), uploads finalize synchronously and immediately,
  # preventing files from getting stuck in "processing" state (HTTP 425 / spinner).
  asyncUploads: false

  # Upload chunk size in bytes (20MB = 20971520, optimal for Cloudflare 100MB body limit)
  maxChunkSize: 20971520

  # Thumbnails service configuration
  thumbnails:
    cs3Insecure: true
    webdavInsecure: true
    storageRoot: "/var/lib/ocis/storage/users/uploads/thumbnails"

# Authentication & OIDC Settings
auth:
  # "internal" uses embedded IDP/IDM. "oidc" delegates to external Keycloak/IdP.
  provider: oidc

  # External OIDC Configuration (e.g. Keycloak)
  oidc:
    enabled: true
    issuer: "https://auth.unity-workspace.com/realms/unity-workspace"
    clientId: "udrive"
    authority: "https://auth.unity-workspace.com/realms/unity-workspace"
    metadataUrl: "https://auth.unity-workspace.com/realms/unity-workspace/.well-known/openid-configuration"
    scope: "openid profile email roles"
    postLogoutRedirectUri: "https://drive.unity-workspace.com/login"
    autoProvisionAccounts: true
    userClaim: "preferred_username"
    roleClaim: "realm_access.roles"
    roleAssignmentDriver: "oidc"

# Embedded IDM Service (Identity Management / LDAP)
idm:
  enabled: true
  tag: "v1.2.9"
  nodeSelector: {}
  affinity: {}


# Storage Backend Configuration
storage:
  # "ocis" (POSIX persistent volume) or "s3ng" (S3 / MinIO Object Storage)
  driver: s3ng

  # S3 Object Storage Configuration (used when driver: s3ng, sensitive keys injected from Vault)
  s3:
    endpoint: "https://10.1.18.7:9000"
    region: "default"
    bucket: "udrive"
    insecure: true
    accessKey: ""
    secretKey: ""
    existingSecret: ""
    accessKeyKey: "access-key"
    secretKeyKey: "secret-key"
    caCert: ""

# Valkey Distributed Cache & Lock Store (used for multi-replica HA scaling)
valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: "8.0-alpine"
    pullPolicy: IfNotPresent
  maxmemory: "800mb"
  maxmemoryPolicy: "allkeys-lru"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

# Redis Distributed Cache & Lock Store (optional alternative)
redis:
  enabled: false
  endpoint: ""

# Office Document Collaboration (Collabora Online / WOPI)
collaboration:
  enabled: false
  appAddr: "http://collabora:9980"
  appIcon: "collabora"
  insecure: true

# Persistent Volume Claims
persistence:
  # Storage volume for user files and database (/var/lib/ocis)
  data:
    enabled: true
    storageClass: "longhorn"
    accessMode: ReadWriteMany
    size: 50Gi
    annotations: {}

  # Storage volume for configuration and encryption keys (/etc/ocis)
  config:
    enabled: true
    storageClass: "longhorn"
    accessMode: ReadWriteMany
    size: 2Gi
    annotations: {}

  # Dedicated high-speed buffer for in-progress uploads (/var/lib/ocis/storage/users/uploads)
  # Set to false to share in-progress chunks across all replicas via the shared Longhorn RWX PVC
  uploads:
    enabled: false
    # Mode options:
    #   "ramdisk" -> in-memory tmpfs emptyDir (~10,000 MB/s, zero disk wear)
    #   "local"   -> node-local SSD emptyDir (~2,000 MB/s, preserves RAM)
    #   "pvc"     -> dedicated PersistentVolumeClaim (e.g. local-path or nvme-ssd)
    mode: "ramdisk"
    sizeLimit: "8Gi"
    pvc:
      storageClass: ""
      accessMode: ReadWriteOnce
      size: 20Gi

# Service Settings
service:
  type: ClusterIP
  port: 9200

# Ingress Settings
ingress:
  enabled: true
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
  hosts:
    - host: drive.unity-workspace.com
      paths:
        - path: /
          pathType: Prefix

# Compute Resources
resources:
  limits:
    cpu: 4000m
    memory: 4096Mi
  requests:
    cpu: 500m
    memory: 1024Mi

# Health Check Probes
livenessProbe:
  httpGet:
    path: /healthz
    port: 9200
    scheme: HTTPS
  initialDelaySeconds: 45
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /readyz
    port: 9200
    scheme: HTTPS
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Pod and Container Security Contexts
podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

# Node scheduling
nodeSelector: {}
tolerations: []
affinity:
  nodeAffinity: {}
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - udrive
          topologyKey: kubernetes.io/hostname

# Shared NATS Event Broker for Multi-Replica HA
nats:
  enabled: true
  tag: "v1.2.9"

# Automated Kubernetes Worker Node Kernel Network Socket Tuning
nodeTuning:
  enabled: true
  sysctl:
    netCoreSomaxconn: 65535
    netIpv4TcpMaxSynBacklog: 65535
    netCoreRmemMax: 16777216
    netCoreWmemMax: 16777216
    netIpv4TcpRmem: "4096 87380 16777216"
    netIpv4TcpWmem: "4096 65536 16777216"
    fsFileMax: 2097152
    fsInotifyMaxUserWatches: 524288
