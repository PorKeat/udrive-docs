# Global settings
global:
  domain: drive.unity-workspace.com

# Deployment replicas (used when autoscaling is disabled)
replicaCount: 2

# Horizontal Pod Autoscaler (HPA)
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 12
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Container image settings
image:
  repository: ghcr.io/unity-workspace-org/udrive
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v1.4.15"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

# ServiceAccount Configuration
serviceAccount:
  create: true
  name: "udrive"
  annotations: {}

# HashiCorp Vault Agent Integration
vault:
  # Enable Vault Agent sidecar injection
  enabled: true
  # Vault server address
  address: "https://10.1.18.8:8200"
  # Kubernetes auth role in Vault
  role: "udrive-role"
  # Secret path in Vault (KV v2)
  secretPath: "secret/data/udrive"
  # Skip TLS certificate verification when connecting to Vault
