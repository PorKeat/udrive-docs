{{- if and .Values.nodeTuning .Values.nodeTuning.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "udrive.fullname" . }}-node-tuner
  labels:
    {{- include "udrive.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-tuner
spec:
  selector:
    matchLabels:
      {{- include "udrive.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node-tuner
  template:
    metadata:
      labels:
        {{- include "udrive.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node-tuner
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      initContainers:
        - name: sysctl-tuner
          image: busybox:1.37
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              sysctl -w net.core.somaxconn={{ .Values.nodeTuning.sysctl.netCoreSomaxconn | default 65535 }}
              sysctl -w net.ipv4.tcp_max_syn_backlog={{ .Values.nodeTuning.sysctl.netIpv4TcpMaxSynBacklog | default 65535 }}
              sysctl -w net.core.rmem_max={{ .Values.nodeTuning.sysctl.netCoreRmemMax | default 16777216 }}
              sysctl -w net.core.wmem_max={{ .Values.nodeTuning.sysctl.netCoreWmemMax | default 16777216 }}
              sysctl -w net.ipv4.tcp_rmem={{ .Values.nodeTuning.sysctl.netIpv4TcpRmem | default "4096 87380 16777216" | quote }}
              sysctl -w net.ipv4.tcp_wmem={{ .Values.nodeTuning.sysctl.netIpv4TcpWmem | default "4096 65536 16777216" | quote }}
              sysctl -w fs.file-max={{ .Values.nodeTuning.sysctl.fsFileMax | default 2097152 }}
              sysctl -w fs.inotify.max_user_watches={{ .Values.nodeTuning.sysctl.fsInotifyMaxUserWatches | default 524288 }}
              echo ">>> Worker node network kernel socket parameters applied successfully."
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
{{- end }}
